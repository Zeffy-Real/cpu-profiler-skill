name: cpu-profiler
version: 1.0.0
description: "7x24 continuous CPU profiling tool with perf black-box mode"
author: Zeffy-Real
license: MIT

parameters:
  sample_freq:
    description: "Sampling frequency in Hz"
    default: 99
    type: integer
    range: [1, 999]
  slice_duration:
    description: "Duration of each profiling slice in seconds"
    default: 30
    type: integer
  retention_hours:
    description: "Data retention period in hours"
    default: 2
    type: integer
  data_dir:
    description: "Data storage directory"
    default: /var/lib/cpu-profiler
    type: path
  api_port:
    description: "REST API port"
    default: 8765
    type: integer

dependencies:
  system:
    - perf
    - flamegraph.pl
    - stackcollapse-perf.pl
  python:
    - fastapi>=0.100
    - uvicorn[standard]>=0.20
    - pydantic>=2.0

install: ./install.sh
start: systemctl start cpu-profiler-collector cpu-profiler-api
