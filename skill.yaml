name: cpu-profiler
version: "1.0.0"
description: >
  Linux continuous CPU profiling tool. Runs perf as a background daemon
  with time-sliced recording. Query by time to generate flame graphs
  for root cause analysis.

parameters:
  data_dir:
    description: Directory for storing perf data files
    default: /var/lib/cpu-profiler
  sample_freq:
    description: Sampling frequency in Hz
    default: 99
  slice_duration:
    description: Duration of each recording slice in seconds
    default: 30
  retention_hours:
    description: How long to keep profiling data
    default: 2
  api_host:
    description: API server bind address
    default: 0.0.0.0
  api_port:
    description: API server port
    default: 8765

dependencies:
  - perf (linux-tools)
  - flamegraph.pl (FlameGraph)
  - stackcollapse-perf.pl (FlameGraph)
  - python3 >= 3.10
  - fastapi
  - uvicorn
  - pydantic

install: |
  sudo bash install.sh

start: |
  sudo systemctl start cpu-profiler-collector cpu-profiler-api

stop: |
  sudo systemctl stop cpu-profiler-collector cpu-profiler-api

status: |
  sudo systemctl status cpu-profiler-collector cpu-profiler-api

verify: |
  curl http://localhost:8765/api/v1/health
